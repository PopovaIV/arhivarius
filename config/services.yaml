parameters:
    uploads_dir: '%kernel.project_dir%/%env(UPLOADS_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\FileStorage:
        arguments:
            $uploadsDir: '%uploads_dir%'

    App\Service\BookCoverGenerator:
        arguments:
            $uploadsDir: '%uploads_dir%'

    App\Service\TextExtractor:
        arguments:
            $uploadsDir: '%uploads_dir%'
