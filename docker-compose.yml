services:
  php:
    build:
      context: ./docker/php
    container_name: genarchive_php
    volumes:
      - ./:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://genarchive:secret@postgres:5432/genarchive?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: '!ChangeThisMercureHubJWTSecretKey!'
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - genarchive

  nginx:
    image: nginx:1.27-alpine
    container_name: genarchive_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - genarchive

  postgres:
    image: postgres:16-alpine
    container_name: genarchive_postgres
    environment:
      POSTGRES_USER: genarchive
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: genarchive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genarchive"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - genarchive

  redis:
    image: redis:7-alpine
    container_name: genarchive_redis
    volumes:
      - redis_data:/data
    networks:
      - genarchive

  mercure:
    image: dunglas/mercure:latest
    container_name: genarchive_mercure
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080
        anonymous
    ports:
      - "3000:80"
    networks:
      - genarchive

  mailpit:
    image: axllent/mailpit:latest
    container_name: genarchive_mailpit
    ports:
      - "8025:8025"
    networks:
      - genarchive

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  postgres_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  redis_data:

networks:
  genarchive:
    driver: bridge
